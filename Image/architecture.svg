<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Compliant Control and Application: architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .h  { font-size: 15px; font-weight: bold; fill: #222; }
      .t  { font-size: 13px; font-weight: bold; fill: #222; }
      .s  { font-size: 12px; fill: #444; }
      .ln { stroke: #444; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>

  <!-- control_algorithms -->
  <rect x="20" y="20" width="600" height="100" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="36" y="44" class="h">control_algorithms</text>
  <rect x="36" y="56" width="270" height="50" rx="6" fill="#fff" stroke="#3b6fd8"/>
  <text x="48" y="78" class="t">admittance</text>
  <text x="48" y="96" class="s">M·a + D·v + K·Δx = F</text>
  <rect x="320" y="56" width="284" height="50" rx="6" fill="#fff" stroke="#3b6fd8"/>
  <text x="332" y="78" class="t">hybrid_position_force_control</text>
  <text x="332" y="96" class="s">move to a target, press on the surface</text>

  <!-- topics -->
  <path d="M150,120 L150,178" class="ln" marker-end="url(#arrow)"/>
  <text x="160" y="154" class="s">EE twist</text>
  <path d="M420,178 L420,120" class="ln" marker-end="url(#arrow)"/>
  <text x="430" y="154" class="s">EE pose, wrench</text>

  <!-- ros2_control -->
  <rect x="20" y="180" width="600" height="80" rx="10" fill="#e7f6ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="36" y="204" class="h">ros2_control</text>
  <text x="36" y="228" class="t">cartesian_velocity_controller</text>
  <text x="36" y="246" class="s">EE twist → joint velocities (KDL IK)</text>
  <text x="330" y="228" class="t">broadcasters</text>
  <text x="330" y="246" class="s">joint states, F/T sensor wrench</text>

  <path d="M320,262 L320,318" class="ln" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="330" y="294" class="s">joint commands / states</text>

  <!-- Gazebo -->
  <rect x="20" y="320" width="600" height="90" rx="10" fill="#fff4e5" stroke="#d9822b" stroke-width="1.5"/>
  <text x="36" y="344" class="h">Gazebo Sim</text>
  <text x="36" y="368" class="t">robot + F/T sensor + probe tool</text>
  <text x="36" y="386" class="s">UR5 · Franka FR3 · B601-DM</text>
  <text x="330" y="368" class="t">car wheel</text>
  <text x="330" y="386" class="s">work piece (world:=polish)</text>

  <!-- robots/ -->
  <rect x="660" y="20" width="260" height="390" rx="10" fill="#f3ecfa" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="676" y="44" class="h">robots</text>
  <rect x="676" y="58" width="228" height="72" rx="6" fill="#fff" stroke="#7e57c2"/>
  <text x="688" y="80" class="t">&lt;robot&gt;_sim</text>
  <text x="688" y="98" class="s">model + controller config</text>
  <text x="688" y="116" class="s">ur5 · franka · b601_dm</text>
  <path d="M790,130 L790,166" class="ln" marker-end="url(#arrow)"/>
  <rect x="676" y="168" width="228" height="72" rx="6" fill="#fff" stroke="#7e57c2"/>
  <text x="688" y="190" class="t">robot_sim_bringup</text>
  <text x="688" y="208" class="s">sim.launch.py: starts Gazebo,</text>
  <text x="688" y="226" class="s">robot and controllers</text>
  <path d="M790,240 L790,365 L622,365" class="ln" marker-end="url(#arrow)"/>
  <text x="800" y="300" class="s">spawn</text>
</svg>
