  fixed_frame: world
  # base_link is 0.40 m above the world origin (pedestal).
  # Home TCP: [0.341, 0.0, 0.056] in base_link = [0.341, 0.0, 0.456] in world.
  # Car-wheel work piece for world:=polish, [x y z roll pitch yaw] in world:
