  description_file: urdf/ur5.urdf.xacro
  controllers_file: config/controllers.yaml
  # Packages whose meshes Gazebo has to resolve (package:// URIs)
  resource_packages: [ur_description]
  fixed_frame: world
  # Home TCP (tool pointing down): [0.487, 0.109, 0.290] in base_link.
  # Car-wheel work piece for world:=polish, [x y z roll pitch yaw] in world:
  # axle along y, top of the tyre (z = 0.217) 7 cm below the probe tip and
  # 3 cm behind it so that the contact surface is slightly inclined.
  workpiece_pose: [0.457, 0.109, 0.0, 0.0, 0.0, 1.5707963]
